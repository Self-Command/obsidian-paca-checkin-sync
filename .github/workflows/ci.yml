name: Check and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --package-lock-only && npm ci; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-lock
          path: package-lock.json
      - name: Portable contract and production checks
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
          ! grep -E 'require\("(node:|fs|http|electron)' main.js
      - name: Package source-bound plugin candidate
        run: |
          mkdir -p release/obsidian-paca-checkin-sync
          cp main.js manifest.json styles.css release/obsidian-paca-checkin-sync/
          jq -n --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" '{source_sha:$sha,action_run:$run,phone_verified:false}' > release/build-info.json
          cd release
          zip -r obsidian-paca-checkin-sync.zip obsidian-paca-checkin-sync
          sha256sum obsidian-paca-checkin-sync.zip obsidian-paca-checkin-sync/* build-info.json > checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-candidate
          path: release/
  official-e2e:
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      PACA_A_SHA: fdcf0e6d6343ab21a5f4e7f6ad0e154101a0d8df
      PACA_C_SHA: a74294c13e32c889578c091d200b72566f1aa088
      TASK_SYNC_E2E: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Self-Command/paca-plugin-tasknotes-webhook
          ref: fdcf0e6d6343ab21a5f4e7f6ad0e154101a0d8df
          path: acceptance/a
      - uses: actions/download-artifact@v4
        with:
          name: plugin-candidate
          path: release/
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - name: Pin verified source and independent artifacts
        run: python3 scripts/e2e-prepare.py
      - name: Locked official recurrence runtime
        working-directory: acceptance/a/recurrence
        run: npm ci --ignore-scripts
      - name: Official browser and app runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libnss3 libasound2t64
          pip install playwright==1.55.0 boto3==1.40.25
          playwright install --with-deps chromium
      - name: Real official TaskNotes and Obsidian writeback
        working-directory: acceptance/a
        env:
          OBSIDIAN_SYNC_ROOT: ${{ github.workspace }}
          OBSIDIAN_EXTRA_SETUP: ${{ github.workspace }}/scripts/e2e-setup.py
          OBSIDIAN_EXTRA_E2E: ${{ github.workspace }}/scripts/e2e-ui.py
        run: |
          printf 'package buildinfo\nfunc init() { SourceSHA = "%s" }\n' "$PACA_A_SHA" > internal/buildinfo/stamp.go
          export GITHUB_REPOSITORY=Self-Command/paca-plugin-tasknotes-webhook
          go build -trimpath -o /tmp/tasknotes-worker ./cmd/worker
          bun scripts/tasknotes-fixture.ts
          python3 scripts/host-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-writeback-evidence
          path: acceptance/a/verification/
      - name: Host diagnostics
        if: failure()
        run: |
          docker logs paca-ci-api --tail 80 || true
          docker logs paca-sync-checkin-worker --tail 40 || true
  publish:
    needs: [build, official-e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plugin-candidate
          path: release/
      - name: Source-bound development Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v0.1.0-dev.${{ github.run_number }}"
          printf '配合官方 TaskNotes 的 Paca 任务、打卡记录及照片同步插件。\n\n源码：%s\nAction 已验证构建、普通双向同步与官方 Obsidian 照片回写，真实手机验证另行记录。\n' "$GITHUB_SHA" > release-notes.md
          gh release create "$version" --target "$GITHUB_SHA" --prerelease --title "$version" --notes-file release-notes.md release/obsidian-paca-checkin-sync.zip release/obsidian-paca-checkin-sync/main.js release/obsidian-paca-checkin-sync/manifest.json release/obsidian-paca-checkin-sync/styles.css release/checksums.txt release/build-info.json
